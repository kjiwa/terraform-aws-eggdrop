repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Parallel `terraform init` races on TF_PLUGIN_CACHE_DIR in CI
        # (hashicorp/terraform#31964).
        args:
          # Re-init once when a cached provider no longer matches the lock file.
          # First, because terraform_validate.sh does not trim the space the
          # hook framework puts before later --hook-config entries.
          - --hook-config=--retry-once-with-cleanup=true
          - --hook-config=--parallelism-limit=1
        # The root module and modules/edge declare configuration_aliases, which
        # cannot bind when a module is validated standalone as this hook does
        # -- there is no caller to supply the alias (hashicorp/terraform#28490).
        # tflint still lints both directly. CI validates examples/*/ and runs
        # terraform test to cover them in context.
        exclude: ^([^/]+\.tf|modules/edge/.*)$
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows sourced files; the shebangs are #!/bin/sh, so shellcheck
        # enforces POSIX automatically, including `local` (SC3043).
        args: [-x]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: hygiene
        name: hygiene
        entry: sh scripts/hygiene.sh
        language: system
        exclude: ^LICENSE$
      - id: script-tests
        name: script tests
        entry: sh scripts/tests/run.sh
        language: system
        pass_filenames: false
        files: ^scripts/
